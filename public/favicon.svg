<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#222222"/>
  <!-- 4x4 KenKen board -->
  <rect x="48" y="48" width="416" height="416" rx="14" fill="#2b2b31" stroke="#f2f3f5" stroke-width="8"/>

  <!-- thin grid lines -->
  <g stroke="#3a3a40" stroke-width="2">
    <line x1="152" y1="48" x2="152" y2="464"/>
    <line x1="256" y1="48" x2="256" y2="464"/>
    <line x1="360" y1="48" x2="360" y2="464"/>
    <line x1="48" y1="152" x2="464" y2="152"/>
    <line x1="48" y1="256" x2="464" y2="256"/>
    <line x1="48" y1="360" x2="464" y2="360"/>
  </g>

  <!-- bold cage boundaries -->
  <g stroke="#f2f3f5" stroke-width="6">
    <line x1="152" y1="360" x2="152" y2="464"/>
    <line x1="256" y1="48" x2="256" y2="256"/>
    <line x1="360" y1="48" x2="360" y2="360"/>
    <line x1="48" y1="152" x2="256" y2="152"/>
    <line x1="360" y1="152" x2="464" y2="152"/>
    <line x1="48" y1="256" x2="360" y2="256"/>
    <line x1="48" y1="360" x2="464" y2="360"/>
  </g>

  <!-- cage targets + operation -->
  <g font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#a6aab0">
    <text x="60" y="82">3+</text>
    <text x="268" y="82">1−</text>
    <text x="60" y="186">6×</text>
    <text x="60" y="290">8+</text>
    <text x="372" y="186">3+</text>
    <text x="164" y="394">6+</text>
  </g>

  <!-- filled values -->
  <g font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#f2f3f5" text-anchor="middle">
    <text x="412" y="120">4</text>
    <text x="100" y="432">4</text>
    <text x="204" y="224">3</text>
    <text x="308" y="328">1</text>
    <text x="412" y="432">3</text>
  </g>
</svg>
